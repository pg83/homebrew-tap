name: Reconcile formulae

# No cross-repo trigger exists and no cross-repo token is wanted: the
# schedule reconciles the formulae against the latest shitty release with
# this repository's own token, so there is nothing to expire or leak.
on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: shitty release tag (empty reconciles with latest)
        required: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile the formulae
        run: python3 scripts/update.py ${{ inputs.tag }}
      - name: Commit and push
        run: |
          git config user.name "shitty release bot"
          git config user.email "noreply@github.com"
          git add Formula
          git diff --cached --quiet && exit 0
          git commit -m "Reconcile terminal formulae"
          git push
